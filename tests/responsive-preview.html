<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HTOS responsive checks</title><style>*{box-sizing:border-box}body{margin:0;background:#e5e9e2;font:13px system-ui;color:#17392f}header{padding:12px;background:white;display:grid;gap:8px}nav{display:flex;gap:5px;flex-wrap:wrap}button,select{padding:8px;border:1px solid #bacbbb;border-radius:7px;background:white;color:#17392f;font:inherit}button[aria-pressed=true]{background:#17392f;color:white}#stage{overflow:hidden;position:relative;margin:10px auto;max-width:1440px}iframe{border:0;transform-origin:top left;background:#f5f5ef}output{font-size:12px}h1{font-size:15px;margin:0}</style></head><body><header><h1>HTOS · synthetic responsive preview</h1><nav aria-label="Screen widths"><button data-width="320">320px</button><button data-width="390">390px</button><button data-width="768">768px</button><button data-width="1024">1024px</button><button data-width="1440">1440px</button></nav><select aria-label="Preview screen"><option value="/">Overview</option><option value="/orders">Order history</option><option value="/new-order?draft=qa-draft">Place order</option><option value="/deliveries">Incoming orders</option><option value="/settings?tab=products">Products</option><option value="/settings?tab=users">Team</option><option value="/reports">Insights</option></select><output id="metrics"></output></header><div id="stage"><iframe title="HTOS test screen" src="ui-preview.html#/" width="390" height="844"></iframe></div><script>let width=390;const frame=document.querySelector('iframe'),stage=document.querySelector('#stage');function size(){const scale=Math.min(1,(document.documentElement.clientWidth-20)/width);frame.style.width=width+'px';frame.style.height=(width<621?844:1000)+'px';frame.style.transform='scale('+scale+')';stage.style.width=(width*scale)+'px';stage.style.height=((width<621?844:1000)*scale)+'px';document.querySelectorAll('[data-width]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.width===width)));}document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{width=+b.dataset.width;size()});document.querySelector('select').onchange=e=>frame.src='ui-preview.html#'+e.target.value;window.onresize=size;size();setInterval(()=>{try{const d=frame.contentDocument;document.querySelector('#metrics').textContent=width+'px viewport · '+(d.documentElement.scrollWidth>d.documentElement.clientWidth+1?'Page overflow: '+d.documentElement.scrollWidth+'px':'No page overflow');}catch{}},500);</script></body></html>
